      summary: Contestação de Pix perdida
      operationId: webhookMedApproved
      description: |
        A contestação foi **deferida**: o comprador foi estornado com o seu
        dinheiro, e a retenção virou débito definitivo.

        **Leia o nome com atenção.** `approved` descreve a decisão sobre a
        CONTESTAÇÃO, não sobre você - é a má notícia. O nome espelha o
        status interno (`status: approved`) para que evento, painel e API
        falem uma língua só; quem quiser o placar tem `status` e
        `resolved_by`, e o painel mostra "Perdida".

        Aja revertendo o que `med.opened` mandou segurar: **cancele o
        acesso, o envio ou a assinatura**. A venda está devolvida.

        `resolved_by` diz de onde veio o desfecho: `platform` é a Vext
        decidindo, `seller` é você tendo assumido a contestação pelo
        painel. `data.charge` vem com `status` e `refunded_amount` já
        atualizados.
