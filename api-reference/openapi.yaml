  med.opened:
    post:
      summary: Contestação de Pix aberta
      operationId: webhookMedOpened
      description: |
        O comprador abriu uma contestação de Pix (MED) contra uma venda
        sua. **O valor já saiu do seu saldo disponível** e ficou retido até
        a decisão - você o vê em "Em contestação", e ele não é sacável.

        Aja como em `charge.in_analysis`: **segure a entrega**. Uma
        contestação pode terminar com o dinheiro devolvido ao comprador, e
        aí o produto já entregue não volta.

        Você tem `defence_deadline` para mandar a sua versão pelo painel.
        O prazo não trava a decisão - ele diz de quem é a vez.

        `opened_by` muda o que você está respondendo: `customer` é o
        formulário público preenchido pela pessoa; `support` é a Vext
        registrando o que ouviu por outro canal. As duas valem igual e
        retêm igual, mas sustentam alegações diferentes.

        Sobre quem contestou vai só o nome. O e-mail e o telefone ficam de
        fora de propósito: a alegação é de fraude, você é a parte acusada,
        e o contato de quem acusa seria um canal de pressão fora do
        processo. Os dados de quem PAGOU continuam em `data.charge.customer`.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
        - $ref: '#/components/parameters/EventHeader'
