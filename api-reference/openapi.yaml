  responses:
    BadRequest:
      description: Requisição malformada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            chaveLonga:
              summary: idempotency_key_too_long
              value:
                error:
                  type: invalid_request_error
                  code: idempotency_key_too_long
                  message: A chave de idempotência deve ter no máximo 255 caracteres.
                  details: {}

    Unauthorized:
      description: |
        Chave ausente, desconhecida, revogada ou expirada. A revogada é
        distinguida da inexistente na MENSAGEM, nunca no status: quem
        integra precisa saber que a chave existiu e foi desligada, e quem
        está adivinhando tokens não aprende nada com isso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ausente:
              summary: missing_api_key
              value:
                error:
                  type: authentication_error
                  code: missing_api_key
                  message: 'Envie a chave em Authorization: Bearer sk_live_...'
                  details: {}
            invalida:
              summary: invalid_api_key
              value:
                error:
                  type: authentication_error
                  code: invalid_api_key
                  message: Chave de API inválida.
                  details: {}
            revogada:
              summary: revoked_api_key
              value:
                error:
                  type: authentication_error
                  code: revoked_api_key
                  message: Esta chave de API foi revogada. Gere uma nova em Desenvolvedores.
                  details: {}
            expirada:
              summary: expired_api_key
              value:
                error:
                  type: authentication_error
                  code: expired_api_key
                  message: Esta chave de API expirou. Gere uma nova em Desenvolvedores.
                  details: {}

    Forbidden:
      description: |
        A chave é válida, mas não tem o escopo do endpoint. `403` e não
        `401` de propósito: `401` diria "sua chave está errada" a quem tem
        a chave certa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            escopo:
              summary: insufficient_scope
              value:
                error:
                  type: permission_error
                  code: insufficient_scope
                  message: 'Esta chave não tem o escopo [refunds:write].'
                  details:
                    required_ability: refunds:write
                    abilities: [charges:read, charges:write]
            umClique:
              summary: one_click_requires_three_ds
              value:
                error:
                  type: permission_error
                  code: one_click_requires_three_ds
                  message: >-
                    Esta loja exige autenticação do portador, e o pagamento
                    de um clique não a suporta.
                  details: {}

    NotFound:
      description: |
        O recurso não existe - ou é de outra conta, o que daqui dá no
        mesmo. Não distinguimos os dois casos: responder "existe, mas não é
        seu" confirmaria a existência de cobranças alheias a quem tentasse
        adivinhar códigos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            naoEncontrado:
              value:
                error:
                  type: not_found_error
                  code: resource_not_found
                  message: Recurso não encontrado.
                  details: {}

    CardDeclined:
      description: |
        A operadora recusou o cartão.

        **A cobrança EXISTE.** Ela tem código, aparece em `GET /v1/charges`
        e vem inteira em `error.details.charge`. Ainda assim a resposta é
        um erro, e a escolha é deliberada: um `201` com `status: "failed"`
        é exatamente o corpo que uma integração escrita como
        `if (response.ok) { liberar(); }` lê como sucesso - e aí o produto
        sai de graça, em silêncio, até a conciliação.

        `decline_code` é o retorno da adquirente. Ele sai aqui, e não no
        objeto da cobrança, porque quem lê esta resposta é o seu servidor,
        com a chave secreta: o mesmo dado numa resposta alcançável do
        navegador seria um oráculo para quem testa cartão em lote.

        Repetir a MESMA chamada pode dar certo sem nada mudar do seu lado -
        o limite diário do portador vira, o banco libera. E pode nunca dar.
        Não é erro de requisição: o corpo estava certo, a chave estava
        certa, e quem disse não foi o emissor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            recusado:
              value:
                error:
                  type: card_error
                  code: card_declined
                  message: O cartão não tem saldo ou limite disponível. Tente outro cartão.
                  details:
                    charge_id: ch_01k1y6r6m6q2x0p3d9v4t7c8n2
                    decline_code: '51'

    IdempotencyConflict:
      description: Conflito de chave de idempotência.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            reusada:
              summary: idempotency_key_reused
              description: |
                A chave já foi usada com outro corpo. Devolver a resposta
                antiga faria você acreditar que cobrou o valor novo.
              value:
                error:
                  type: idempotency_error
                  code: idempotency_key_reused
                  message: Esta chave de idempotência já foi usada com um corpo diferente. Use uma chave nova.
                  details: {}
            emAndamento:
              summary: idempotency_key_in_progress
              value:
                error:
                  type: idempotency_error
                  code: idempotency_key_in_progress
                  message: Uma requisição com esta chave ainda está em processamento. Tente novamente em instantes.
                  details: {}


    ValidationFailed:
      description: Campos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validacao:
              value:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: Alguns campos não passaram na validação.
                  details:
                    amount:
                      - O valor deve ser um inteiro em centavos (R$ 10,00 = 1000).

    UnprocessableCharge:
      description: |
        A requisição está bem formada, mas foi recusada por uma regra de
        negócio. Todos os `code` abaixo são estáveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validacao:
              summary: validation_failed
              value:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: Alguns campos não passaram na validação.
                  details:
                    customer.name:
                      - O campo nome é obrigatório.
            abaixoDoMinimo:
              summary: amount_below_minimum
              value:
                error:
                  type: invalid_request_error
                  code: amount_below_minimum
                  message: O valor está abaixo do mínimo permitido.
                  details: {}
            acimaDoMaximo:
              summary: amount_above_maximum
              value:
                error:
                  type: invalid_request_error
                  code: amount_above_maximum
                  message: O valor está acima do máximo permitido.
                  details: {}
            itens:
              summary: items_do_not_match_amount
              value:
                error:
                  type: invalid_request_error
                  code: items_do_not_match_amount
                  message: A soma dos itens deve ser igual ao valor da cobrança.
                  details: {}
            vendedor:
              summary: seller_not_approved
              description: |
                O cadastro do vendedor não está aprovado para transacionar.
                Nada na chamada resolve - o caminho é o painel.
              value:
                error:
                  type: invalid_request_error
                  code: seller_not_approved
                  message: Este vendedor não pode transacionar no momento.
                  details: {}
            provedor:
              summary: provider_rejected
              description: |
                O provedor recusou o conteúdo. A mensagem crua dele nunca
                sai daqui - cita ids e endpoints que não existem no nosso
                contrato.
              value:
                error:
                  type: invalid_request_error
                  code: provider_rejected
                  message: O provedor de pagamento recusou esta cobrança. Confira os dados do comprador e do valor.
                  details: {}

    UnprocessableRefund:
      description: O estorno foi recusado por uma regra de negócio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            naoEstornavel:
              summary: charge_not_refundable
              value:
                error:
                  type: invalid_request_error
                  code: charge_not_refundable
                  message: Uma venda aguardando pagamento não pode ser estornada.
                  details: {}
            acimaDoRestante:
              summary: exceeds_remaining
              value:
                error:
                  type: invalid_request_error
                  code: exceeds_remaining
                  message: 'O valor pedido (R$ 200,00) é maior que o disponível para estorno (R$ 60,00).'
                  details: {}
            prazo:
              summary: refund_window_closed
              description: |
                O prazo conta do PAGAMENTO, não da criação: uma cobrança que
                ficou dias pendente antes de ser paga não chega com o prazo
                já gasto.
              value:
                error:
                  type: invalid_request_error
                  code: refund_window_closed
                  message: O prazo de 90 dias para estornar esta venda já passou.
                  details: {}
            desabilitado:
              summary: refund_disabled
              value:
                error:
                  type: invalid_request_error
                  code: refund_disabled
                  message: Estorno não está habilitado para esta conta. Fale com o suporte.
                  details: {}

    RateLimited:
      description: |
        Requisições demais.

        Há três limites, por minuto: um por IP antes da autenticação, e
        depois um de leitura e um de escrita, ambos por CHAVE - o excesso
        de uma integração não consome a cota das outras do mesmo
        vendedor. A escrita é bem mais apertada porque cada cobrança
        criada vira uma chamada ao provedor.

        `Retry-After` diz em quantos segundos voltar. Os cabeçalhos
        `X-RateLimit-*` vêm em TODA resposta, não só nesta: são eles que
        permitem desacelerar antes de bater no limite.
      headers:
        Retry-After:
          description: Segundos até a cota ser reposta.
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Requisições permitidas por minuto neste balde.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Quantas ainda cabem no minuto corrente.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            cota:
              summary: too_many_requests
              value:
                error:
                  type: rate_limit_error
                  code: too_many_requests
                  message: Muitas requisições. Tente novamente em 42 segundos.
                  details:
                    retry_after: 42
            provedor:
              summary: provider_rate_limited
              value:
                error:
                  type: rate_limit_error
                  code: provider_rate_limited
                  message: Limite de requisições do provedor atingido. Tente novamente em instantes.
                  details: {}

    InternalError:
      description: |
        Erro inesperado do nosso lado. Repita com a mesma
        `Idempotency-Key` - ela é o que torna repetir seguro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            interno:
              value:
                error:
                  type: api_error
                  code: internal_error
                  message: Erro interno. Se persistir, informe o horário da chamada ao suporte.
                  details: {}

    ProviderUnavailable:
      description: |
        O provedor de pagamento não respondeu. **Repita com a mesma
        `Idempotency-Key`**: pode ser que a cobrança tenha sido criada lá e
        a resposta se perdido no caminho, e a mesma chave devolve a
        cobrança em vez de criar outra.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            indisponivel:
              value:
                error:
                  type: api_error
                  code: provider_unavailable
                  message: O provedor de pagamento não respondeu. Repita a requisição com a mesma Idempotency-Key.
                  details: {}

    PlatformUnavailable:
      description: |
        A plataforma não está apta a criar cobranças agora. É problema
        nosso: nada que você mude na chamada resolve.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            indisponivel:
              value:
                error:
                  type: api_error
                  code: platform_unavailable
                  message: A plataforma está temporariamente indisponível para criar cobranças. Tente novamente em instantes.
                  details: {}
