components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_… | sk_test_…
      description: |
        Chave secreta do vendedor, criada no painel em **Desenvolvedores**.

        O valor em claro existe uma única vez, na criação. Guardamos só o
        hash SHA-256 - nem o suporte consegue recuperá-lo, o que é o ponto:
        um dump do nosso banco não permite cobrar em nome de ninguém.

        A chave vai no **servidor**. Colocá-la no navegador do comprador a
        entrega a qualquer pessoa que abra a página.


  parameters:
    ChargeCode:
      name: code
      in: path
      required: true
      description: Código público da cobrança, no formato `ch_…`.
      schema:
        type: string
        pattern: '^ch_[0-9a-z]{26}$'
      example: ch_01k1y6r6m6q2x0p3d9v4t7c8n2

    SavedCardCode:
      name: code
      in: path
      required: true
      description: Código público do cartão guardado, no formato `pm_…`.
      schema:
        type: string
        pattern: '^pm_[0-9a-z]{26}$'
      example: pm_01k1y6r6m6q2x0p3d9v4t7c8n2



    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Identificador único da SUA tentativa. Use o mesmo valor ao repetir
        a requisição depois de um erro de rede.

        Opcional, mas recomendado em toda criação de cobrança e estorno.
        Sem ele, uma repetição cria uma segunda cobrança.
      schema:
        type: string
        maxLength: 255
      example: pedido-1042

    SignatureHeader:
      name: X-Vext-Signature
      in: header
      required: true
      description: |
        Assinatura da entrega, no formato `t=<timestamp>,v1=<hmac>`, onde
        `hmac` é `HMAC-SHA256("<timestamp>.<corpo bruto>", <segredo>)`.

        Duas regras ao conferir:

        1. Calcule sobre o **corpo bruto**, antes de desserializar.
           Reserializar muda espaçamento e ordem, e o HMAC deixa de bater.
        2. **Recuse timestamps com mais de 5 minutos.** É isso que impede
           alguém que interceptou uma entrega de `charge.paid` de reenviá-la
           quantas vezes quiser, com assinatura perfeitamente válida.
      schema:
        type: string
        pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'
      example: t=1785931392,v1=8f3c1d0a5b7e9042c6a1b3d5e7f9012345678901abcdef234567890abcdef1234

    EventHeader:
      name: X-Vext-Event
      in: header
      required: true
      description: |
        Tipo do evento, repetido fora do corpo. Redundante com o payload e
        útil mesmo assim: permite filtrar no seu log sem desserializar nada.
      schema:
        type: string
      example: charge.paid

    DeliveryHeader:
      name: X-Vext-Delivery
      in: header
      required: true
      description: |
        Identificador da entrega. Cite-o ao abrir um chamado - é por ele que
        localizamos a tentativa, a resposta do seu servidor e o horário.
      schema:
        type: string
      example: '4821'

  headers:
    IdempotentReplayed:
      description: |
        Presente com valor `true` quando o corpo devolvido é uma resposta
        **gravada**, e não um recurso novo. Nada foi criado nesta chamada.
      schema:
        type: string
        enum: ['true']

  schemas:
    Cents:
      type: integer
      format: int64
      description: |
        Valor monetário em **centavos inteiros** de real. R$ 10,00 = `1000`.
        Nunca decimal, nunca string.

    ChargeStatus:
      type: string
      description: |
        Situação da cobrança. Só os estados de trânsito - `pending`,
        `processing` e `in_analysis` - ainda mudam sozinhos; os demais são
        terminais, exceto os que ainda admitem estorno.

        `processing` e `in_analysis` são do cartão: a autorização é
        decidida na mesma requisição, mas pode parar na análise de fraude
        antes de virar `paid` ou `failed`. No PIX a cobrança vai direto de
        `pending` para o desfecho.

        `partially_refunded` é estado próprio, e não um `refunded` com
        asterisco: tratar uma venda devolvida pela metade como estornada
        faria seu relatório descontar o valor inteiro.

        `chargedback` é definitivo: o dinheiro voltou pelo caminho da
        bandeira, e nem cancelamento nem estorno são mais possíveis.
      enum:
        - pending
        - processing
        - in_analysis
        - paid
        - expired
        - canceled
        - partially_refunded
        - refunded
        - failed
        - chargedback
      x-labels:
        pending: Aguardando pagamento
        processing: Processando
        in_analysis: Em análise
        paid: Pago
        expired: Expirado
        canceled: Cancelado
        partially_refunded: Estornado em parte
        refunded: Estornado
        failed: Falhou
        chargedback: Chargeback

    RefundStatus:
      type: string
      enum: [pending, succeeded, failed]
      description: |
        `failed` significa que a devolução **não** aconteceu e o saldo do
        vendedor foi reposto. A linha permanece de propósito: uma tentativa
        de devolver dinheiro que não deu certo é exatamente o que alguém vai
        procurar depois.

    Customer:
      type: object
      required: [name, email, document, phone_ddd, phone_number]
      properties:
        name:
          type: string
          maxLength: 120
          example: João Comprador
        email:
          type: string
          format: email
          maxLength: 180
          description: |
            Obrigatório: sem e-mail o provedor aceita o pedido e devolve
            uma cobrança sem QR code.
          example: joao@exemplo.com.br
        document:
          type: string
          maxLength: 20
          description: |
            CPF ou CNPJ. Pontuação é aceita e descartada - guardamos apenas
            os dígitos. Obrigatório: sem documento o provedor aceita o
            pedido e devolve uma cobrança sem QR code.
          example: '111.444.777-35'
        document_type:
          type: [string, 'null']
          enum: [CPF, CNPJ, PASSPORT, null]
        phone_ddd:
          type: string
          maxLength: 3
          description: |
            DDD de quem vai pagar. Obrigatório: sem telefone o provedor
            aceita o pedido e devolve uma cobrança sem QR code.
          example: '11'
        phone_number:
          type: string
          maxLength: 12
          description: |
            Número sem o DDD. Oito dígitos (fixo) ou nove (celular, sempre
            começando com 9).
          example: '987654321'

    CustomerSummary:
      type: object
      description: O comprador, como devolvemos.
      required: [name, email, document]
      properties:
        name:
          type: [string, 'null']
        email:
          type: [string, 'null']
        document:
          type: [string, 'null']
          description: |
            Mascarado. Você já enviou o documento; devolvê-lo inteiro em
            toda consulta espalharia o dado sem nenhum ganho.
          example: '111.***.***-35'

    ChargeItem:
      type: object
      required: [description, quantity, amount]
      properties:
        code:
          type: [string, 'null']
          maxLength: 60
          description: Seu código do produto.
        description:
          type: string
          maxLength: 180
        quantity:
          type: integer
          minimum: 1
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Valor **unitário** em centavos inteiros. A soma de
            `quantity * amount` de todos os itens precisa ser exatamente
            igual ao `amount` da cobrança.

    CreateChargeRequest:
      type: object
      required: [amount, customer, items]
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          minimum: 1
          description: |
            Valor total da cobrança, em **centavos inteiros**. R$ 100,00 =
            `10000`. Um decimal aqui é recusado com `422`.
        description:
          type: [string, 'null']
          maxLength: 255
          description: Aparece para o comprador na tela de pagamento.
        reference:
          type: [string, 'null']
          maxLength: 120
          description: |
            Sua referência (número do pedido, id interno). Volta na consulta
            e nos webhooks, e serve de filtro em `GET /v1/charges` - é o que
            permite casar a cobrança com o seu pedido sem guardar o nosso
            `id`.
        metadata:
          type: [object, 'null']
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 500
          propertyNames:
            maxLength: 40
          description: |
            Até **20** pares de chave/valor seus, devolvidos na consulta e
            nos webhooks. É o `reference` para quem precisa de mais de um
            rótulo - com uma diferença: `reference` filtra a listagem,
            `metadata` não.

            **Os valores devem ser strings.** Um número aqui é recusado com
            `422`: `{"total": 10.10}` voltaria como `10.1`, e a formatação
            do seu dado é sua. Envie `{"total": "10.10"}`.
          example:
            carrinho: cart_88f21
            campanha: black-friday
        expires_in:
          type: [integer, 'null']
          minimum: 60
          maximum: 604800
          default: 86400
          description: |
            Validade do QR, em segundos. O piso de 60s evita uma cobrança
            que expira antes de o comprador abrir o aplicativo do banco.
            Omitindo o campo, a cobrança vale 24 horas.
        customer_ip:
          type: [string, 'null']
          format: ip
          description: |
            O IP do **comprador**, em IPv4 ou IPv6.

            Numa integração servidor-a-servidor quem abre a conexão conosco
            é o seu servidor. Sem este campo é o endereço **dele** que
            guardamos, e o "Local" da venda no painel apontaria para o seu
            datacenter em toda cobrança. Mande o IP de quem está comprando
            e o dado passa a valer numa contestação.

            Fica fora de `customer` porque é da tentativa, não do cadastro:
            muda a cada compra da mesma pessoa.
          example: 189.45.12.7
        payment_method:
          type: string
          enum: [pix, credit_card]
          default: pix
          description: |
            Omitido, é `pix` - e continua sendo, para sempre. Toda
            integração que existe hoje manda o corpo sem este campo, e
            torná-lo obrigatório as quebraria todas por uma adição nossa.

            Com `credit_card`, o objeto `card` passa a ser obrigatório e
            `expires_in` passa a ser recusado: cartão não expira.
        card:
          oneOf:
            - $ref: '#/components/schemas/CardInput'
            - type: 'null'
          description: |
            Obrigatório quando `payment_method` é `credit_card`, e
            **recusado** nos demais. Mandá-lo num PIX devolve `422`: aceitar
            e ignorar faria você ver a cobrança nascer e acreditar que
            cobrou no cartão.
        three_d_secure:
          type: string
          enum: [automatic, required, off]
          default: automatic
          description: |
            Quanto de autenticação do portador você está pedindo. É um
            **pedido**, nunca a decisão.

            A configuração da sua loja é PISO: com o 3DS exigido na conta,
            um `off` aqui não desliga nada. A assimetria é deliberada - o
            que se perde ao desligar não é uma preferência, é o liability
            shift numa contestação.

            `required` escala por cobrança, e serve a quem conhece o
            próprio risco melhor que a configuração da conta: um pedido de
            valor alto, um comprador novo, um endereço que não bate.

            `automatic` pode escalar sozinho **acima de um piso de valor**
            definido pela plataforma. O piso costuma vir desligado; quando
            estiver ligado, uma venda a partir dele passa a exigir os
            identificadores de autenticação. `off` é a forma de recusar
            esse piso — e **só ele**: a configuração da sua conta continua
            sendo o chão, e um `off` não a alcança.

            Como o desafio roda no NAVEGADOR, quem cobra servidor a
            servidor e não consegue produzir `three_ds_transaction_id`
            deve mandar `off` explicitamente em vez de contar com o
            padrão.
        save_card:
          type: boolean
          default: false
          description: |
            Guarda o cartão no cofre **se, e somente se, a venda for
            aprovada**, e a próxima cobrança usa `card.id`. Recusada, nada
            é guardado: uma referência de autorização negada é uma
            referência que a própria Pagar.me pode não honrar depois.

            O `pm_` não volta nesta resposta - ele nasce depois dela.
            Busque-o em `GET /v1/cards?customer_document=…`.

            **Recusado junto com `card.id`**: aquele cartão já está
            guardado, e aceitar-e-ignorar ensinaria errado.

            Guardar credencial de pagamento sem o comprador ter pedido é
            problema regulatório antes de ser problema de produto. O
            consentimento é seu para colher.
        device_event_id:
          type: [string, 'null']
          maxLength: 255
          description: |
            O identificador do evento de identificação do aparelho - é o
            `deviceEventId` que o `createToken()` da Pagar.me devolve ao
            seu JavaScript.

            Opcional sempre. Bloqueador de anúncio corta a identificação
            com frequência, e recusar a venda porque o enriquecimento de
            risco não carregou troca uma fraude possível por uma perda
            certa.
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChargeItem'
          description: |
            **Obrigatório.** Ao menos um item, e a soma de
            `quantity × amount` deve bater com `amount` da cobrança.

            Os itens são a única descrição do que está sendo vendido que
            chega ao arranjo de pagamento: é o que o comprador lê no
            aplicativo do banco ao confirmar o PIX. Por isso não são
            opcionais - uma cobrança que não diz o que cobra chega à tela
            dele como um valor sem causa.

    SavedCard:
      type: object
      description: |
        Um cartão guardado. **Todo campo está sempre presente.**

        O que NÃO está aqui, e não vai estar: as referências da Pagar.me
        que de fato cobram, e os seis primeiros dígitos. As primeiras são o
        equivalente ao cartão para quem as tem; o BIN somado aos quatro
        últimos é material de correlação que você não precisa.
      required:
        - object
        - id
        - brand
        - last_four
        - exp_month
        - exp_year
        - holder_name
        - expired
        - created_at
        - last_used_at
      properties:
        object:
          type: string
          const: card
        id:
          type: string
          pattern: '^pm_[0-9a-z]{26}$'
        brand:
          type: [string, 'null']
          enum: [visa, mastercard, elo, hipercard, amex, diners, discover, aura, null]
        last_four:
          type: [string, 'null']
        exp_month:
          type: [integer, 'null']
          minimum: 1
          maximum: 12
        exp_year:
          type: [integer, 'null']
        holder_name:
          type: [string, 'null']
        expired:
          type: boolean
          description: |
            Vencido é ESTADO, e não ausência: o cartão continua na lista
            para você entender por que a cobrança de um clique parou de
            funcionar para aquele comprador.
        created_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time





    CardInput:
      type: object
      description: |
        O cartão, como ele chega até nós.

        Note o que **não** está aqui, e nem poderia: número, validade e
        CVV. O navegador do comprador os troca por um token direto com a
        Pagar.me, pela biblioteca dela. Nenhum endpoint desta API aceita o
        número de um cartão, e é isso que mantém a sua aplicação e a nossa
        fora do escopo de PCI.

        São **dois formatos mutuamente excludentes**: `token`, para um
        cartão que o comprador acabou de digitar, e `id`, para um que já
        está no cofre. Mandar os dois devolve `422` - aceitar deixaria a
        escolha de qual cobrar para o provedor.
      required: [installments]
      properties:
        id:
          type: [string, 'null']
          pattern: '^pm_[0-9a-z]{26}$'
          description: |
            Um cartão guardado, de `GET /v1/cards`. **Excludente com
            `token`**, e é o pagamento de um clique: o comprador não digita
            nada, e por isso `holder_name` e `billing_address` não vêm - o
            cofre já os tem.

            Uma loja que exige 3DS não cobra assim: veja
            `one_click_requires_three_ds` abaixo.
          example: pm_01k1y6r6m6q2x0p3d9v4t7c8n2
        token:
          type: string
          maxLength: 255
          description: |
            O token de uso único, criado no navegador. Vale cerca de um
            minuto - tokenize no envio do formulário, nunca na abertura da
            página.

            **Obrigatório na ausência de `id`.** Com ele vêm `holder_name`
            e `billing_address`, que sem ele são recusados.
          example: token_ORP978GFOUoQD58x
        installments:
          type: integer
          minimum: 1
          maximum: 12
          description: |
            Conferido de novo contra a escada por valor e a taxa da sua
            conta na criação - consulte `GET /v1/installments` para saber o
            que está disponível antes de cobrar.
        holder_name:
          type: string
          maxLength: 64
          description: |
            O nome impresso no cartão, sem acento. A Pagar.me recusa o
            pedido com acento ou com mais de 64 caracteres.
          example: JOAO COMPRADOR
        holder_document:
          type: [string, 'null']
          maxLength: 20
          description: CPF ou CNPJ do portador, quando diferente do comprador.
        brand:
          type: [string, 'null']
          maxLength: 32
          description: |
            A bandeira lida do BIN no navegador. Serve para PRECIFICAR, e
            não é confiável - a de verdade só aparece na resposta do
            pedido, e é ela que volta em `card.brand`.
        billing_address:
          type: object
          description: |
            **Obrigatório.** O antifraude reprova bem mais sem endereço, e
            é ele que a bandeira compara com o cadastro do portador numa
            contestação. O antifraude é cobrado por transação, aprovada ou
            não: vale mandar tudo que ele sabe ler.
          required: [zip_code, street, number, neighborhood, city, state]
          properties:
            zip_code:
              type: string
              maxLength: 16
              example: '01310100'
            street:
              type: string
              maxLength: 120
            number:
              type: string
              maxLength: 20
            complement:
              type: [string, 'null']
              maxLength: 80
            neighborhood:
              type: string
              maxLength: 80
            city:
              type: string
              maxLength: 80
            state:
              type: string
              minLength: 2
              maxLength: 2
              example: SP
        three_ds:
          type: [object, 'null']
          description: |
            O resultado da autenticação do portador, quando ela aconteceu.
            **Obrigatório** se a sua loja exige 3DS ou se você pediu
            `three_d_secure: "required"`; recusado com `422` na ausência.

            Quem produz estes dois valores é o navegador, contra o servidor
            da Stone. Não tente montá-los do seu lado: quem confere a
            autenticação de verdade é a Pagar.me, no momento do pedido, e
            um identificador forjado simplesmente não vira autenticação.
          required: [transaction_id, status]
          properties:
            transaction_id:
              type: string
              maxLength: 64
            status:
              type: string
              enum: [Y, A]
              description: |
                Só `Y` (autenticado) e `A` (tentativa comprovada) são
                aceitos - são os dois que carregam o liability shift em
                Visa e Mastercard. Os demais dizem que o emissor negou ou
                não respondeu, e a cobrança é recusada antes de sair.

    RefundChargeRequest:
      type: object
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          minimum: 1
          description: |
            Quanto devolver, em **centavos inteiros**. Omita para devolver
            todo o saldo estornável da cobrança.
        reason:
          type: [string, 'null']
          maxLength: 255
          description: Motivo, para o seu histórico e o nosso.

    Charge:
      type: object
      description: |
        Uma cobrança, como a API a devolve. **Todo campo desta lista está
        sempre presente** - os anuláveis vêm com `null`, nunca ausentes.
        Marcar como opcional o que nunca falta obrigaria você a testar a
        existência de uma chave que sempre existe.

        Nos webhooks há uma exceção documentada: veja `ChargeMinimal`.
      required:
        - object
        - id
        - status
        - payment_method
        - amount
        - currency
        - platform_fee
        - net_amount
        - refunded_amount
        - description
        - reference
        - metadata
        - customer
        - pix
        - card
        - created_at
        - paid_at
        - expired_at
        - refunded_at
      properties:
        object:
          type: string
          const: charge
        id:
          type: string
          description: |
            Código público da cobrança. Nunca é a chave primária: expor o
            autoincremento diria a qualquer cliente quantas vendas a
            plataforma inteira processou.
          example: ch_01k1y6r6m6q2x0p3d9v4t7c8n2
        status:
          $ref: '#/components/schemas/ChargeStatus'
        payment_method:
          type: string
          enum: [pix, credit_card]
          description: |
            O meio pelo qual esta cobrança foi criada. Omitir o campo na
            criação continua significando `pix` - é o que toda integração
            que existe hoje espera, e mudar isso as quebraria todas de uma
            vez.
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: Valor cobrado, em centavos inteiros.
        currency:
          type: string
          const: BRL
        platform_fee:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Nossa taxa, em centavos inteiros. Congelada na criação: reflete
            o contrato que valia quando a venda aconteceu, não o de hoje.
        net_amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            O que fica com o vendedor, em centavos inteiros: `amount` menos
            a nossa taxa e menos a taxa do meio de pagamento, que é
            descontada direto do recebimento dele. Por isso
            `amount - platform_fee` dá um número MAIOR que este.
        refunded_amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Total já devolvido ao comprador, em centavos inteiros. Acumulado
            entre estornos parciais.
        description:
          type: [string, 'null']
        reference:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            O que você enviou na criação. **Sempre um objeto**, `{}` quando
            não houve nada - nunca `null`, para o seu código não ter dois
            casos a tratar.
          example:
            carrinho: cart_88f21
            campanha: black-friday
        customer:
          oneOf:
            - $ref: '#/components/schemas/CustomerSummary'
            - type: 'null'
          description: |
            `null` na cobrança que não tem comprador vinculado. A chave em
            si nunca falta.
        pix:
          type: object
          description: |
            Presente em toda cobrança, inclusive nas de cartão - onde os
            três campos vêm `null`. Um objeto sempre presente evita o
            `if (charge.pix)` antes de cada leitura.
          required: [qr_code, expires_at, end_to_end_id]
          properties:
            qr_code:
              type: [string, 'null']
              description: |
                Payload copia-e-cola do PIX. Gere a imagem do QR a partir
                dele - não devolvemos PNG.
            expires_at:
              type: [string, 'null']
              format: date-time
            end_to_end_id:
              type: [string, 'null']
              description: |
                Identificador da transação no Sistema de Pagamentos
                Brasileiro. Aparece depois do pagamento e é o que o banco do
                comprador reconhece.
        card:
          type: object
          description: |
            Presente em toda cobrança, inclusive nas de PIX - onde os campos
            vêm `null`. Mesma regra do `pix` acima, e pelo mesmo motivo.

            O que **não** está aqui, e não vai estar: os seis primeiros
            dígitos, o código de retorno da adquirente e a nota do
            antifraude. Os dois primeiros são diagnóstico nosso; a nota numa
            resposta pública seria um oráculo de risco para quem testa
            cartão em lote. O código de recusa sai numa recusa, em
            `error.details.decline_code`, onde quem lê é o seu servidor.
          required: [brand, last_four, holder_name, installments, interest, three_d_secure, authorized_at]
          properties:
            brand:
              type: [string, 'null']
              description: |
                A bandeira que a **Pagar.me** reconheceu, e não a que o
                navegador leu do BIN. Elas divergem, e a que vale é esta.
              enum: [visa, mastercard, elo, hipercard, amex, diners, discover, aura, null]
            last_four:
              type: [string, 'null']
            holder_name:
              type: [string, 'null']
            installments:
              type: [integer, 'null']
              description: |
                `null` no PIX. A coluna tem default `1`, mas "uma parcela"
                numa cobrança que não parcela é um número que convida a
                conta errada.
            interest:
              allOf:
                - $ref: '#/components/schemas/Cents'
              description: |
                Os juros do parcelamento, em centavos inteiros, e `0` nas
                parcelas sem juros. Eles viajam à Pagar.me como um ITEM à
                parte - ela deriva o valor do pedido da soma dos itens, e um
                pedido que não fecha é recusado inteiro.
            three_d_secure:
              type: object
              required: [status, transaction_id]
              properties:
                status:
                  type: [string, 'null']
                  description: |
                    O `transStatus` do protocolo. `Y` é autenticado, `A` é
                    tentativa comprovada - os dois carregam o liability
                    shift em Visa e Mastercard.
                  enum: [Y, A, N, C, U, R, I, null]
                transaction_id:
                  type: [string, 'null']
                  description: |
                    O identificador da autenticação. É ele que se apresenta
                    à bandeira numa contestação.
            authorized_at:
              type: [string, 'null']
              format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        expired_at:
          type: [string, 'null']
          format: date-time
        refunded_at:
          type: [string, 'null']
          format: date-time

    ChargeMinimal:
      type: object
      description: |
        A cobrança em versão reduzida, que só aparece em **webhooks**.

        Quando a montagem do corpo completo falha do nosso lado, o evento
        sai assim em vez de não sair: um `charge.paid` menor ainda avisa que
        a venda foi paga, e nenhum evento deixaria você sem saber. É um
        caminho de exceção, não o normal - mas ele existe, e um cliente
        escrito contra o schema cheio quebraria justamente no dia ruim.

        Quando isso acontece, busque o restante em `GET /v1/charges/{code}`.
      required: [object, id, status, payment_method, amount, currency, metadata]
      properties:
        object:
          type: string
          const: charge
        id:
          type: string
          example: ch_01k1y6r6m6q2x0p3d9v4t7c8n2
        status:
          $ref: '#/components/schemas/ChargeStatus'
        payment_method:
          type: string
          enum: [pix, credit_card]
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: Valor cobrado, em centavos inteiros.
        currency:
          type: string
          const: BRL
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            Vai até no corpo reduzido: é por ela que você reencontra o
            pedido do seu lado, e um evento sem ela anunciaria um pagamento
            sem dizer a que se refere.

    WebhookCharge:
      description: |
        A cobrança dentro de um evento. Quase sempre o objeto `Charge`
        completo; `ChargeMinimal` no caminho degradado descrito nele.
      anyOf:
        - $ref: '#/components/schemas/Charge'
        - $ref: '#/components/schemas/ChargeMinimal'

    Refund:
      type: object
      description: |
        Um estorno. `charge`, `failed_reason` e `processed_at` são os
        únicos campos que podem faltar: os três vêm na resposta da API, mas
        o objeto embutido nos webhooks `charge.refunded` e
        `charge.chargedback` não os inclui.
      required:
        - object
        - id
        - status
        - amount
        - currency
        - fee_returned
        - seller_debit
        - reason
        - created_at
      properties:
        object:
          type: string
          const: refund
        id:
          type: string
          example: rf_01k1y7c3n8b5w2q9r4t6y8u1i3
        charge:
          type: string
          description: Código da cobrança estornada.
        status:
          $ref: '#/components/schemas/RefundStatus'
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            O que volta ao comprador, em centavos inteiros. Do ponto de
            vista dele o estorno é sempre integral: a política de taxa
            decide quem financia, nunca quanto ele recebe.
        currency:
          type: string
          const: BRL
        fee_returned:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Quanto da nossa taxa devolvemos, em centavos inteiros.
        seller_debit:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            O que efetivamente sai do saldo do vendedor, em centavos
            inteiros. Sempre `amount - fee_returned`. Pode ser MAIOR que o
            líquido recebido na venda, quando a política retém o custo que o
            provedor não devolve.
        reason:
          type: [string, 'null']
        failed_reason:
          type: [string, 'null']
          description: Preenchido quando `status` é `failed`.
        created_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time

    Balance:
      type: object
      required:
        - object
        - currency
        - balance
        - available
        - reserved
        - debt
        # Anuláveis, e ainda assim sempre presentes: `null` aqui quer dizer
        # "a consulta ao provedor falhou", que é diferente de zero e
        # diferente de ausente.
        - withdrawable
        - provider
      properties:
        object:
          type: string
          const: balance
        currency:
          type: string
          const: BRL
        balance:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Saldo do extrato, em centavos inteiros. Pode ser NEGATIVO -
            acontece quando um estorno chega depois do saque.
        available:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            O que já pode sair pelo nosso extrato, em centavos inteiros.
            Nunca negativo: veja `debt`.
        reserved:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Retido pela reserva rolante, em centavos inteiros. É dinheiro do
            vendedor que ainda não pode sair - sem este campo, a diferença
            entre `balance` e `available` pareceria erro do sistema.
        debt:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Quanto o vendedor deve, em centavos inteiros. Estado próprio, e
            não "saldo zero": as próximas vendas cobrem automaticamente e só
            o saque fica bloqueado até lá.
        withdrawable:
          oneOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: |
            O que dá para sacar AGORA, em centavos inteiros. `null` quando a
            consulta ao provedor falhou.
        provider:
          oneOf:
            - type: object
              required: [available, waiting_funds]
              properties:
                available:
                  allOf:
                    - $ref: '#/components/schemas/Cents'
                  description: Disponível na adquirente, em centavos inteiros.
                waiting_funds:
                  allOf:
                    - $ref: '#/components/schemas/Cents'
                  description: |
                    A caminho na adquirente, em centavos inteiros.
            - type: 'null'
          description: |
            `null` quando a consulta ao provedor falhou. Diferente de zero.

    Installments:
      type: object
      description: |
        A grade de parcelamento para um valor, como o SEU SERVIDOR a
        recebe. **Todo campo está sempre presente** - `message` e
        `unavailable_reason` vêm `null` quando há grade, e `matrix` vem
        `{}` quando não há.
      required: [object, amount, available, unavailable_reason, message, matrix]
      properties:
        object:
          type: string
          const: installments
        amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: O valor consultado, de volta, em centavos inteiros.
        available:
          type: boolean
        unavailable_reason:
          type: [string, 'null']
          description: |
            Por que não há grade. Trate por ele, nunca pela `message`.

            As seis primeiras são chaves de configuração, e cada uma tem
            dono diferente: a plataforma, a conta Pagar.me que atende a sua
            loja, o interruptor da sua conta, o status do seu cadastro, a
            credencial do provedor e o seu contrato de taxa.
            `amount_below_minimum` é outra coisa - o cartão está de pé, o
            que não cabe é este valor.
          enum:
            - platform_disabled
            - gateway_account_disabled
            - seller_disabled
            - seller_cannot_transact
            - no_credential
            - fee_disabled
            - amount_below_minimum
            - null
        message:
          type: [string, 'null']
          description: A frase em português, para o seu log. Não é contrato.
        matrix:
          type: object
          description: |
            Mapa de bandeira para lista de opções. **Objeto vazio**, nunca
            lista vazia, quando não há grade.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/InstallmentOption'


    InstallmentOption:
      type: object
      required: [installments, total_cents, installment_cents, interest_cents, label]
      properties:
        installments:
          type: integer
          minimum: 1
          maximum: 12
        total_cents:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: O que o comprador paga no total, já com juros.
        installment_cents:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: O valor de cada parcela.
        interest_cents:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Os juros embutidos, em centavos inteiros. `0` nas parcelas sem
            juros. Eles viajam até a Pagar.me como um ITEM à parte, e é por
            isso que o comprador vê a conta separada na tela.
        label:
          type: string
          description: A opção já escrita para a tela, em português.
          example: 12x de R$ 10,65

    Pagination:
      type: object
      required: [page, per_page, total, total_pages, has_more]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        has_more:
          type: boolean
          description: Há página seguinte?

    ChargeList:
      type: object
      required: [object, data, pagination]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, details]
          properties:
            type:
              type: string
              description: |
                Família do erro. Responde "de quem é o problema e o que
                fazer": `invalid_request_error` se corrige mudando a
                chamada, `authentication_error` trocando a chave, e
                `api_error` é nosso - repita, não reescreva.
              enum:
                - authentication_error
                - permission_error
                - invalid_request_error
                - idempotency_error
                - not_found_error
                - rate_limit_error
                - api_error
                - card_error
            code:
              type: string
              description: |
                Código estável do erro. **Trate por ele.** A `message` pode
                ser reescrita a qualquer momento; o código, não.
            message:
              type: string
              description: Explicação em português, para leitura humana.
            details:
              type: object
              description: |
                Sempre objeto, mesmo vazio. Em `validation_failed`, traz os
                campos recusados e suas mensagens.
              additionalProperties: true

    EventEnvelope:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          description: |
            Identificador do evento. Estável entre as retentativas da mesma
            entrega - use-o para deduplicar do seu lado.
          example: evt_01k1y6r7z2m4n6p8q0r2s4t6u8
        type:
          type: string
          enum:
            - charge.paid
            - charge.failed
            - charge.in_analysis
            - charge.refunded
            - charge.chargedback
            - withdrawal.paid
            - med.opened
            - med.approved
            - med.rejected
        created_at:
          type: string
          format: date-time

    ChargePaidEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [charge]
              properties:
                charge:
                  $ref: '#/components/schemas/WebhookCharge'

    ChargeRefundedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [charge, refund]
              properties:
                charge:
                  $ref: '#/components/schemas/WebhookCharge'
                refund:
                  $ref: '#/components/schemas/Refund'

    WithdrawalPaidEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [withdrawal]
              properties:
                withdrawal:
                  type: object
                  required:
                    - object
                    - id
                    - status
                    - amount
                    - currency
                    - fee
                    - net_amount
                    - requested_at
                    - processed_at
                  properties:
                    object:
                      type: string
                      const: withdrawal
                    id:
                      type: string
                      example: wd_01k1y8d4h1g2f3e4d5c6b7a8z9
                    status:
                      type: string
                      enum: [paid]
                    currency:
                      type: string
                      const: BRL
                    amount:
                      allOf:
                        - $ref: '#/components/schemas/Cents'
                      description: Valor pedido, em centavos inteiros.
                    fee:
                      allOf:
                        - $ref: '#/components/schemas/Cents'
                      description: |
                        Taxa da transferência, em centavos inteiros.
                        Repasse puro do custo bancário.
                    net_amount:
                      allOf:
                        - $ref: '#/components/schemas/Cents'
                      description: |
                        O que chegou na conta, em centavos inteiros
                        (`amount - fee`).
                    requested_at:
                      type: string
                      format: date-time
                    processed_at:
                      type: [string, 'null']
                      format: date-time

    MedEvidence:
      type: object
      description: |
        Um anexo da contestação, de qualquer um dos dois lados.

        **Não há link.** O disco é privado e os arquivos são servidos por
        streaming autenticado - é material de litígio sobre uma pessoa
        nomeada, e um endereço que funcionasse fora da sessão viveria no
        log de quem recebeu o webhook e poderia ser encaminhado. O
        conteúdo se abre no painel; aqui fica o que foi anexado, por qual
        lado e quando.
      required: [id, side, filename, mime, size, sent_at]
      properties:
        id:
          type: integer
          description: Identificador do anexo dentro da contestação.
          example: 41
        side:
          type: string
          enum: [claimant, seller]
          description: |
            `claimant` é o comprador, ao abrir a contestação. `seller` é a
            sua loja, ao se defender.
        filename:
          type: string
          description: O nome do arquivo como quem enviou o nomeou.
          example: extrato-do-banco.pdf
        mime:
          type: string
          example: application/pdf
        size:
          type: integer
          description: Tamanho em bytes.
          example: 184320
        sent_at:
          type: string
          format: date-time

    MedTimelineEvent:
      type: object
      description: |
        Um passo da linha do tempo da contestação, em ordem cronológica.

        O que aconteceu, quando, e os números do passo. **Quem agiu não
        vai** - nas decisões, quem age é um analista da Vext, e o quadro
        interno da plataforma não é parte do seu contrato.

        Trate `type` como aberto: passos novos podem aparecer, e um
        `switch` sem ramo padrão quebraria na primeira contestação que
        seguisse um caminho novo.
      required: [type, at]
      properties:
        type:
          type: string
          description: |
            Os passos em uso hoje:

            - `opened` - o comprador abriu pelo formulário público
            - `opened_by_admin` - a Vext abriu registrando outro canal
            - `seller_defence` - você enviou contra-evidência
            - `refund_failed` - uma tentativa de estorno não passou; a
              retenção continua e a Vext tenta de novo
            - `approved` / `approved_without_refund` - deferida
            - `seller_accepted` / `seller_accepted_without_refund` -
              deferida porque você assumiu a contestação
            - `rejected` - indeferida
          example: opened
        at:
          type: string
          format: date-time
        held_cents:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: Quanto foi retido neste passo. Só em `opened`.
        released_cents:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: Quanto saiu da retenção. Só nos passos de desfecho.
        evidence_count:
          type: integer
          description: Quantos anexos vieram com a abertura.
        files:
          type: integer
          description: Quantos anexos vieram na sua defesa.
        charge_code:
          type: string
          description: A venda contestada. Só em `opened`.

    Med:
      type: object
      description: |
        Uma contestação de Pix (MED) contra uma venda sua.

        Mesma forma nos três eventos - abertura e desfechos. O que muda é
        o estado dentro dela: guarde o caso pelo `id` e atualize-o a cada
        evento, em vez de esperar corpos diferentes por tipo.
      required:
        - object
        - id
        - status
        - reason
        - held_amount
        - currency
        - end_to_end_id
        - purchase_date
        - opened_by
        - claimant
        - evidence
        - events
        - opened_at
        - defence_deadline
        - responded_at
        - decided_at
        - decision_note
        - resolved_by
        - refund
      properties:
        object:
          type: string
          const: med
        id:
          type: string
          description: |
            O número de protocolo. É o mesmo que o comprador recebe por
            e-mail e o mesmo que aparece no painel.
          example: med_01k2m4n5r3t7v9x1z3b5d7f9h1
        status:
          type: string
          enum: [open, under_review, approved, rejected, refund_failed]
          description: |
            **`approved` é a contestação deferida - ou seja, você perdeu**;
            `rejected` é você ganhando. O adjetivo descreve a decisão sobre
            a contestação, não sobre a loja.

            `open` e `under_review` ainda retêm o valor; `refund_failed`
            também, e significa que a decisão saiu contra você mas o
            estorno ainda não passou. Os eventos entregues carregam
            `open`, `approved` ou `rejected` - os outros dois são estados
            internos que você vê no painel.
        reason:
          type: string
          description: O que o comprador escreveu ao contestar. Texto livre.
          example: Não reconheço esta compra no meu extrato.
        held_amount:
          allOf:
            - $ref: '#/components/schemas/Cents'
          description: |
            Quanto saiu do seu saldo disponível, em centavos inteiros.
            Congelado na abertura: é o valor que a decisão vai devolver a
            você ou ao comprador, e não um recálculo.
        currency:
          type: string
          const: BRL
        end_to_end_id:
          type: string
          description: O identificador do Pix contestado.
          example: E12345678202608041200
        purchase_date:
          type: string
          format: date
          description: |
            A data que o comprador informou ao contestar, como ele a
            digitou. Pode não ser a de `charge.paid_at`.
        opened_by:
          type: string
          enum: [customer, support]
          description: |
            `customer` é o formulário público preenchido pela pessoa;
            `support` é a Vext registrando o que ouviu por outro canal.
            As duas retêm igual, mas sustentam alegações diferentes - vale
            saber o que você está respondendo.
        claimant:
          type: object
          description: |
            Quem abriu a contestação. **Só o nome.**

            E-mail e telefone ficam de fora de propósito: a alegação é de
            fraude e você é a parte acusada - o contato de quem acusa seria
            um canal de pressão fora do processo. O nome vai porque sem ele
            você não reencontra a venda nos seus registros.

            Para os dados de quem PAGOU, use `data.charge.customer`: aquele
            é o seu cliente, gravado no checkout, e você já o recebe em
            `charge.paid`. Podem ser pessoas diferentes.
          required: [name]
          properties:
            name:
              type: string
              example: Maria Souza
        evidence:
          type: array
          description: |
            Os anexos dos DOIS lados, em ordem de envio. Vem vazio quando
            ninguém anexou nada.
          items:
            $ref: '#/components/schemas/MedEvidence'
        events:
          type: array
          description: A linha do tempo da contestação, do mais antigo ao mais novo.
          items:
            $ref: '#/components/schemas/MedTimelineEvent'
        opened_at:
          type: string
          format: date-time
        defence_deadline:
          type: [string, 'null']
          format: date-time
          description: |
            Até quando você pode mandar a sua versão pelo painel. Não trava
            a decisão da Vext - diz de quem é a vez.
        responded_at:
          type: [string, 'null']
          format: date-time
          description: Quando você enviou defesa. `null` se não enviou.
        decided_at:
          type: [string, 'null']
          format: date-time
          description: '`null` enquanto a contestação estiver aberta.'
        decision_note:
          type: [string, 'null']
          description: O motivo da decisão, escrito por quem decidiu.
        resolved_by:
          type: [string, 'null']
          enum: [platform, seller, null]
          description: |
            De onde veio o desfecho: `platform` é a Vext decidindo,
            `seller` é você tendo assumido a contestação pelo painel.
            `null` enquanto não houver decisão.
        refund:
          type: [object, 'null']
          description: |
            O estorno feito ao comprador. `null` em `med.opened` e em
            `med.rejected` - e também numa contestação deferida cuja venda
            já havia sido devolvida por outro caminho.
          required: [object, id, status]
          properties:
            object:
              type: string
              const: refund
            id:
              type: string
              example: re_01k2p7q8r0t2v4x6z8b0d2f4h6
            status:
              $ref: '#/components/schemas/RefundStatus'

    MedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [med, charge]
              properties:
                med:
                  $ref: '#/components/schemas/Med'
                charge:
                  $ref: '#/components/schemas/WebhookCharge'

  examples:
    ChargePendente:
      summary: Cobrança criada, aguardando pagamento
      value:
        object: charge
        id: ch_01k1y6r6m6q2x0p3d9v4t7c8n2
        status: pending
        payment_method: pix
        amount: 10000
        currency: BRL
        platform_fee: 798
        net_amount: 9103
        refunded_amount: 0
        description: Curso de Vue 3
        reference: pedido-1042
        metadata:
          carrinho: cart_88f21
          campanha: black-friday
        customer:
          name: João Comprador
          email: joao@exemplo.com.br
          document: '111.***.***-35'
        pix:
          qr_code: 00020101021226840014br.gov.bcb.pix2562qrcodepix.example.com/v2/abcd1234
          expires_at: '2026-08-04T15:00:00+00:00'
          end_to_end_id: null
        created_at: '2026-08-04T14:00:00+00:00'
        paid_at: null
        expired_at: null
        refunded_at: null

    ChargePaga:
      summary: Cobrança já paga
      value:
        object: charge
        id: ch_01k1y6r6m6q2x0p3d9v4t7c8n2
        status: paid
        payment_method: pix
        amount: 10000
        currency: BRL
        platform_fee: 798
        net_amount: 9103
        refunded_amount: 0
        description: Curso de Vue 3
        reference: pedido-1042
        metadata:
          carrinho: cart_88f21
          campanha: black-friday
        customer:
          name: João Comprador
          email: joao@exemplo.com.br
          document: '111.***.***-35'
        pix:
          qr_code: 00020101021226840014br.gov.bcb.pix2562qrcodepix.example.com/v2/abcd1234
          expires_at: '2026-08-04T15:00:00+00:00'
          end_to_end_id: E12345678202608041200
        created_at: '2026-08-04T14:00:00+00:00'
        paid_at: '2026-08-04T14:03:11+00:00'
        expired_at: null
        refunded_at: null

  responses:
    BadRequest:
      description: Requisição malformada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            chaveLonga:
              summary: idempotency_key_too_long
              value:
                error:
                  type: invalid_request_error
                  code: idempotency_key_too_long
                  message: A chave de idempotência deve ter no máximo 255 caracteres.
                  details: {}

    Unauthorized:
      description: |
        Chave ausente, desconhecida, revogada ou expirada. A revogada é
        distinguida da inexistente na MENSAGEM, nunca no status: quem
        integra precisa saber que a chave existiu e foi desligada, e quem
        está adivinhando tokens não aprende nada com isso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ausente:
              summary: missing_api_key
              value:
                error:
                  type: authentication_error
                  code: missing_api_key
                  message: 'Envie a chave em Authorization: Bearer sk_live_...'
                  details: {}
            invalida:
              summary: invalid_api_key
              value:
                error:
                  type: authentication_error
                  code: invalid_api_key
                  message: Chave de API inválida.
                  details: {}
            revogada:
              summary: revoked_api_key
              value:
                error:
                  type: authentication_error
                  code: revoked_api_key
                  message: Esta chave de API foi revogada. Gere uma nova em Desenvolvedores.
                  details: {}
            expirada:
              summary: expired_api_key
              value:
                error:
                  type: authentication_error
                  code: expired_api_key
                  message: Esta chave de API expirou. Gere uma nova em Desenvolvedores.
                  details: {}

    Forbidden:
      description: |
        A chave é válida, mas não tem o escopo do endpoint. `403` e não
        `401` de propósito: `401` diria "sua chave está errada" a quem tem
        a chave certa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            escopo:
              summary: insufficient_scope
              value:
                error:
                  type: permission_error
                  code: insufficient_scope
                  message: 'Esta chave não tem o escopo [refunds:write].'
                  details:
                    required_ability: refunds:write
                    abilities: [charges:read, charges:write]
            umClique:
              summary: one_click_requires_three_ds
              value:
                error:
                  type: permission_error
                  code: one_click_requires_three_ds
                  message: >-
                    Esta loja exige autenticação do portador, e o pagamento
                    de um clique não a suporta.
                  details: {}

    NotFound:
      description: |
        O recurso não existe - ou é de outra conta, o que daqui dá no
        mesmo. Não distinguimos os dois casos: responder "existe, mas não é
        seu" confirmaria a existência de cobranças alheias a quem tentasse
        adivinhar códigos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            naoEncontrado:
              value:
                error:
                  type: not_found_error
                  code: resource_not_found
                  message: Recurso não encontrado.
                  details: {}

    CardDeclined:
      description: |
        A operadora recusou o cartão.

        **A cobrança EXISTE.** Ela tem código, aparece em `GET /v1/charges`
        e vem inteira em `error.details.charge`. Ainda assim a resposta é
        um erro, e a escolha é deliberada: um `201` com `status: "failed"`
        é exatamente o corpo que uma integração escrita como
        `if (response.ok) { liberar(); }` lê como sucesso - e aí o produto
        sai de graça, em silêncio, até a conciliação.

        `decline_code` é o retorno da adquirente. Ele sai aqui, e não no
        objeto da cobrança, porque quem lê esta resposta é o seu servidor,
        com a chave secreta: o mesmo dado numa resposta alcançável do
        navegador seria um oráculo para quem testa cartão em lote.

        Repetir a MESMA chamada pode dar certo sem nada mudar do seu lado -
        o limite diário do portador vira, o banco libera. E pode nunca dar.
        Não é erro de requisição: o corpo estava certo, a chave estava
        certa, e quem disse não foi o emissor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            recusado:
              value:
                error:
                  type: card_error
                  code: card_declined
                  message: O cartão não tem saldo ou limite disponível. Tente outro cartão.
                  details:
                    charge_id: ch_01k1y6r6m6q2x0p3d9v4t7c8n2
                    decline_code: '51'

    IdempotencyConflict:
      description: Conflito de chave de idempotência.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            reusada:
              summary: idempotency_key_reused
              description: |
                A chave já foi usada com outro corpo. Devolver a resposta
                antiga faria você acreditar que cobrou o valor novo.
              value:
                error:
                  type: idempotency_error
                  code: idempotency_key_reused
                  message: Esta chave de idempotência já foi usada com um corpo diferente. Use uma chave nova.
                  details: {}
            emAndamento:
              summary: idempotency_key_in_progress
              value:
                error:
                  type: idempotency_error
                  code: idempotency_key_in_progress
                  message: Uma requisição com esta chave ainda está em processamento. Tente novamente em instantes.
                  details: {}


    ValidationFailed:
      description: Campos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validacao:
              value:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: Alguns campos não passaram na validação.
                  details:
                    amount:
                      - O valor deve ser um inteiro em centavos (R$ 10,00 = 1000).

    UnprocessableCharge:
      description: |
        A requisição está bem formada, mas foi recusada por uma regra de
        negócio. Todos os `code` abaixo são estáveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validacao:
              summary: validation_failed
              value:
                error:
                  type: invalid_request_error
                  code: validation_failed
                  message: Alguns campos não passaram na validação.
                  details:
                    customer.name:
                      - O campo nome é obrigatório.
            abaixoDoMinimo:
              summary: amount_below_minimum
              value:
                error:
                  type: invalid_request_error
                  code: amount_below_minimum
                  message: O valor está abaixo do mínimo permitido.
                  details: {}
            acimaDoMaximo:
              summary: amount_above_maximum
              value:
                error:
                  type: invalid_request_error
                  code: amount_above_maximum
                  message: O valor está acima do máximo permitido.
                  details: {}
            itens:
              summary: items_do_not_match_amount
              value:
                error:
                  type: invalid_request_error
                  code: items_do_not_match_amount
                  message: A soma dos itens deve ser igual ao valor da cobrança.
                  details: {}
            vendedor:
              summary: seller_not_approved
              description: |
                O cadastro do vendedor não está aprovado para transacionar.
                Nada na chamada resolve - o caminho é o painel.
              value:
                error:
                  type: invalid_request_error
                  code: seller_not_approved
                  message: Este vendedor não pode transacionar no momento.
                  details: {}
            provedor:
              summary: provider_rejected
              description: |
                O provedor recusou o conteúdo. A mensagem crua dele nunca
                sai daqui - cita ids e endpoints que não existem no nosso
                contrato.
              value:
                error:
                  type: invalid_request_error
                  code: provider_rejected
                  message: O provedor de pagamento recusou esta cobrança. Confira os dados do comprador e do valor.
                  details: {}

    UnprocessableRefund:
      description: O estorno foi recusado por uma regra de negócio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            naoEstornavel:
              summary: charge_not_refundable
              value:
                error:
                  type: invalid_request_error
                  code: charge_not_refundable
                  message: Uma venda aguardando pagamento não pode ser estornada.
                  details: {}
            acimaDoRestante:
              summary: exceeds_remaining
              value:
                error:
                  type: invalid_request_error
                  code: exceeds_remaining
                  message: 'O valor pedido (R$ 200,00) é maior que o disponível para estorno (R$ 60,00).'
                  details: {}
            prazo:
              summary: refund_window_closed
              description: |
                O prazo conta do PAGAMENTO, não da criação: uma cobrança que
                ficou dias pendente antes de ser paga não chega com o prazo
                já gasto.
              value:
                error:
                  type: invalid_request_error
                  code: refund_window_closed
                  message: O prazo de 90 dias para estornar esta venda já passou.
                  details: {}
            desabilitado:
              summary: refund_disabled
              value:
                error:
                  type: invalid_request_error
                  code: refund_disabled
                  message: Estorno não está habilitado para esta conta. Fale com o suporte.
                  details: {}

    RateLimited:
      description: |
        Requisições demais.

        Há três limites, por minuto: um por IP antes da autenticação, e
        depois um de leitura e um de escrita, ambos por CHAVE - o excesso
        de uma integração não consome a cota das outras do mesmo
        vendedor. A escrita é bem mais apertada porque cada cobrança
        criada vira uma chamada ao provedor.

        `Retry-After` diz em quantos segundos voltar. Os cabeçalhos
        `X-RateLimit-*` vêm em TODA resposta, não só nesta: são eles que
        permitem desacelerar antes de bater no limite.
      headers:
        Retry-After:
          description: Segundos até a cota ser reposta.
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Requisições permitidas por minuto neste balde.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Quantas ainda cabem no minuto corrente.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            cota:
              summary: too_many_requests
              value:
                error:
                  type: rate_limit_error
                  code: too_many_requests
                  message: Muitas requisições. Tente novamente em 42 segundos.
                  details:
                    retry_after: 42
            provedor:
              summary: provider_rate_limited
              value:
                error:
                  type: rate_limit_error
                  code: provider_rate_limited
                  message: Limite de requisições do provedor atingido. Tente novamente em instantes.
                  details: {}

    InternalError:
      description: |
        Erro inesperado do nosso lado. Repita com a mesma
        `Idempotency-Key` - ela é o que torna repetir seguro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            interno:
              value:
                error:
                  type: api_error
                  code: internal_error
                  message: Erro interno. Se persistir, informe o horário da chamada ao suporte.
                  details: {}

    ProviderUnavailable:
      description: |
        O provedor de pagamento não respondeu. **Repita com a mesma
        `Idempotency-Key`**: pode ser que a cobrança tenha sido criada lá e
        a resposta se perdido no caminho, e a mesma chave devolve a
        cobrança em vez de criar outra.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            indisponivel:
              value:
                error:
                  type: api_error
                  code: provider_unavailable
                  message: O provedor de pagamento não respondeu. Repita a requisição com a mesma Idempotency-Key.
                  details: {}

    PlatformUnavailable:
      description: |
        A plataforma não está apta a criar cobranças agora. É problema
        nosso: nada que você mude na chamada resolve.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            indisponivel:
              value:
                error:
                  type: api_error
                  code: platform_unavailable
                  message: A plataforma está temporariamente indisponível para criar cobranças. Tente novamente em instantes.
                  details: {}
